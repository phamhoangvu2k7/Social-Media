version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: facebook-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facebook_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-24052007}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: facebook-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: